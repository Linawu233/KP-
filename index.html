<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COC 战斗期望与先攻计算器 v7.1</title>
<style>
  :root {
    --bg: #f7f9fc;
    --panel: #ffffff;
    --panel-inner: #f1f5f9;
    --text-main: #475569;
    --text-muted: #94a3b8;
    --accent-blue: #93c5fd;
    --accent-pink: #fbcfe8;
    --accent-pink-dark: #f472b6;
    --accent-blue-dark: #60a5fa;
    --border: #e2e8f0;
    --danger: #fca5a5;
    --danger-text: #b91c1c;
    --success: #86efac;
    --success-text: #15803d;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 30px 16px 60px;
    background-color: var(--bg); color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  
  h1 { font-size: 24px; color: var(--accent-blue-dark); text-align: center; margin-bottom: 4px; font-weight: 600; }
  .subtitle { color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 30px; }
  h2 {
    font-size: 16px; color: var(--text-main); margin: 28px 0 12px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  h2::before {
    content: ''; display: inline-block; width: 4px; height: 16px; border-radius: 2px;
    background: linear-gradient(to bottom, var(--accent-blue), var(--accent-pink));
  }

  /* 布局基础 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .field { display: flex; flex-direction: column; }
  label { font-size: 13px; color: var(--text-main); margin-bottom: 6px; font-weight: 500; }
  
  /* 统一输入框 */
  input[type="text"], input[type="number"] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text-main);
    padding: 0 12px; height: 40px; border-radius: 8px; font-size: 14px;
    outline: none; transition: all 0.2s; width: 100%;
  }
  input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.3); }
  .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* 开关与勾选 */
  .switch-group {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel-inner); padding: 8px 12px; border-radius: 8px; height: 40px;
  }
  .switch-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-pink-dark); cursor: pointer;}
  .switch-group label { margin-bottom: 0; cursor: pointer; font-weight: 600;}

  /* 按钮 */
  button {
    margin-top: 20px; padding: 0 24px; height: 44px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-pink));
    color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.3s; box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center;
  }
  button:hover { opacity: 0.9; transform: translateY(-1px); }
  button.ghost { background: var(--panel); color: var(--text-main); border: 1px solid var(--border); box-shadow: none; }
  button.ghost:hover { background: var(--panel-inner); }
  button.small { height: 36px; padding: 0 16px; font-size: 13px; margin-top: 0; }

  /* 玩家列表 */
  .player-header {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr 40px;
    gap: 10px; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; padding: 0 4px; font-weight: 500;
  }
  .player-row {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr 40px;
    gap: 10px; margin-bottom: 10px; align-items: center;
  }
  .player-row input { height: 38px; margin: 0; padding: 0 8px; font-size: 13px;}
  
  /* DEX输入框带准备钩子 */
  .dex-group { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; height: 38px;}
  .dex-group input { border: none; box-shadow: none; padding: 0; height: 100%; background: transparent; }
  .dex-group input:focus { box-shadow: none; }
  .dex-group label { margin: 0; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 2px; cursor: pointer; white-space: nowrap;}
  .dex-group input[type="checkbox"] { width: 14px; height: 14px; margin: 0; padding: 0;}

  .player-row button.del {
    padding: 0; height: 38px; width: 38px; font-size: 14px;
    background: var(--panel); color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; margin-top: 0; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .player-row button.del:hover { background: var(--danger); color: white; border-color: transparent; }

  /* 单选框 */
  .radio-group { display: flex; gap: 20px; margin-top: 8px; height: 40px; align-items: center;}
  .radio-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: normal; margin-bottom: 0;}
  .radio-group input[type="radio"] { width: 16px; height: 16px; padding: 0; accent-color: var(--accent-pink-dark); }

  /* 结果面板 */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
  .card .k { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .card .v { font-size: 24px; font-weight: 700; color: var(--accent-blue-dark); margin: 4px 0; }
  .card .v.danger { color: var(--danger-text); }
  .card .sub { font-size: 12px; color: var(--text-muted); }
  .card.wide { grid-column: 1 / -1; }
  .card.wide .v { font-size: 18px; color: var(--text-main); }
  .card .row { display: flex; justify-content: space-between; align-items: flex-start; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .card .row:last-child { border-bottom: none; padding-bottom: 0;}
  .card .row .lbl { color: var(--text-muted); font-family: Consolas, monospace; padding-right: 10px; }
  .card .row .val { color: var(--text-main); font-weight: 500; text-align: right;}

  /* 先攻面板 */
  .initiative-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .init-item {
    background: var(--panel-inner); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 20px; display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 14px;
  }
  .init-item .dex { font-size: 12px; color: var(--text-muted); font-weight: normal;}
  .init-item.monster { border-color: var(--accent-pink); background: #fdf2f8; color: var(--accent-pink-dark); }
  .init-item.player { border-color: var(--accent-blue); background: #eff6ff; color: var(--accent-blue-dark); }
  .init-icon { font-size: 18px; }

  /* 方案列表 */
  .patterns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
  .pattern { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; position: relative; box-shadow: var(--shadow); overflow: hidden; }
  .pattern::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent-blue); }
  .pattern.best::before { background: var(--accent-pink-dark); }
  .pattern .tag { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 12px; background: var(--panel-inner); color: var(--text-muted); margin-bottom: 12px; font-weight: 600; }
  .pattern.best .tag { background: #fdf2f8; color: var(--accent-pink-dark); }
  .pattern .style { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
  
  .skill-block { background: var(--panel-inner); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .skill-title { font-size: 13px; font-weight: 600; color: var(--accent-blue-dark); margin-bottom: 8px; display: flex; justify-content: space-between;}
  .skill-line { font-size: 13px; display: flex; justify-content: space-between; padding: 3px 0; }
  .skill-line .lbl { color: var(--text-muted); }
  .skill-line .val { color: var(--text-main); font-family: Consolas, monospace; font-weight: 600;}
  
  .pattern .total { font-size: 14px; display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); margin-top: 8px; }
  .pattern .total .lbl { color: var(--text-main); font-weight: 600;}
  .pattern .total .val { color: var(--accent-pink-dark); font-weight: 700; font-size: 16px;}
  .pattern .err { font-size: 12px; margin-top: 10px; text-align: right; font-weight: 500;}
  .err.good { color: var(--success-text); }
  .err.ok { color: #d97706; }
  .err.bad { color: var(--danger-text); }
  
  .warn { color: var(--danger-text); font-size: 13px; font-weight: 600;}
  .ok { color: var(--success-text); font-size: 13px; font-weight: 600;}
  .death-tag { color: var(--danger-text); font-size: 12px; margin-left: 8px; font-weight: 600; background: #fef2f2; padding: 2px 6px; border-radius: 4px;}
  .penalty-text { font-size: 11px; color: var(--text-muted); display: block; margin-top: 4px; background: rgba(0,0,0,0.03); padding: 2px 6px; border-radius: 4px;}

  /* 手机适配 */
  @media (max-width: 700px) {
    .player-header { display: none; }
    .player-row { 
      grid-template-columns: 1fr 1fr 40px; 
      grid-template-rows: auto auto auto; gap: 8px;
      background: var(--panel); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px;
    }
    .player-row input.p-dmg { grid-column: 1 / 3; }
    .player-row input.p-hit { grid-column: 1 / 2; }
    .player-row input.p-hp { grid-column: 2 / 3; }
    .player-row input.p-att { grid-column: 1 / 2; }
    .player-row .dex-group { grid-column: 2 / 3; }
    .player-row button.del { grid-column: 3 / 4; grid-row: 1; height: 38px; width: 100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 COC 战斗期望计算器</h1>
  <p class="subtitle">多怪物、先攻排序、枪械准备、围攻与减伤规则</p>

  <!-- 玩家列表 -->
  <h2>① 调查员列表</h2>
  <div class="player-header">
    <div>伤害表达式</div>
    <div>命中 %</div>
    <div>HP</div>
    <div>动数</div>
    <div>DEX (准备+50)</div>
    <div></div>
  </div>
  <div id="playerList"></div>
  <button class="small ghost" onclick="addPlayerBtn(event)">+ 添加玩家</button>

  <!-- 怪物配置 -->
  <h2>② 怪物配置与规则</h2>
  <div class="grid">
    <div class="field">
      <label>怪物数量 (最多20)</label>
      <input id="monsterCount" type="number" value="1" min="1" max="20" step="1">
    </div>
    <div class="field">
      <label>单只怪物每轮动数 (最多10)</label>
      <input id="monsterActions" type="number" value="2" min="1" max="10" step="1">
    </div>
    <div class="field">
      <label>怪物敏捷 (DEX)</label>
      <input id="monsterDex" type="number" value="50" min="1" max="99">
    </div>
    <div class="field">
      <label>怪物护甲 (每击减免)</label>
      <input id="monsterArmor" type="number" value="0" min="0" max="20">
    </div>
  </div>

  <div class="grid" style="margin-top: 16px;">
    <div class="field">
      <label>技能数量</label>
      <div class="radio-group">
        <label><input type="radio" name="skillCount" value="1" onchange="toggleSkill2()"> 1 个技能</label>
        <label><input type="radio" name="skillCount" value="2" checked onchange="toggleSkill2()"> 2 个技能</label>
      </div>
    </div>
    <div class="field">
      <label>技能 1 命中率 %</label>
      <input id="skillHit1" type="number" value="60" min="0" max="100">
    </div>
    <div class="field" id="skill2Field">
      <label>技能 2 命中率 %</label>
      <input id="skillHit2" type="number" value="40" min="0" max="100">
    </div>
  </div>

  <!-- 寡不敌众规则 -->
  <div class="field" style="margin-top: 16px;">
    <div class="switch-group">
      <input type="checkbox" id="outnumberedCheck" onchange="toggleOutnumbered()">
      <label for="outnumberedCheck">开启“寡不敌众”规则（怪物数量>1时生效）</label>
    </div>
  </div>
  
  <div class="grid" id="outnumberedFields" style="display:none; margin-top: 12px; background: var(--panel); padding: 16px; border-radius: 8px; border: 1px solid var(--border);">
    <div class="field">
      <label>玩家攻击奖励骰数</label>
      <input id="playerBonusDice" type="number" value="1" min="0" max="2">
      <div class="hint">抵消玩家多动惩罚</div>
    </div>
    <div class="field">
      <label>怪物攻击奖励骰数</label>
      <input id="monsterBonusDice" type="number" value="1" min="0" max="2">
      <div class="hint">增加怪物命中率</div>
    </div>
  </div>

  <!-- KP 目标 -->
  <h2>③ KP 的期望</h2>
  <div class="grid">
    <div class="field">
      <label>希望怪物造成的总伤害</label>
      <input id="totalDamage" type="number" value="40" min="1">
      <div class="hint">所有怪物加起来对队伍的总伤害</div>
    </div>
    <div class="field">
      <label>希望战斗持续轮数 T</label>
      <input id="rounds" type="number" value="4" min="1" step="1">
    </div>
    <div class="field">
      <label>怪物总 HP 难度系数</label>
      <input id="difficulty" type="number" value="1" min="0.1" step="0.1">
    </div>
  </div>

  <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
    <button onclick="calc()">开始计算</button>
    <button class="ghost" onclick="resetAll()">重置面板</button>
  </div>

  <div id="output" style="display:none; margin-top: 40px;">
    
    <h2>④ 行动顺序 (Initiative)</h2>
    <div class="initiative-list" id="initiativeList"></div>

    <h2>⑤ 怪物数值与玩家承受</h2>
    <div class="cards" id="summaryCards"></div>

    <h2>⑥ 可行的技能方案 (单只怪物)</h2>
    <p class="hint" style="margin-top:-8px; margin-bottom: 16px;">方案已考虑怪物数量与总伤害分配。</p>
    <div class="patterns-grid" id="patterns"></div>
  </div>
</div>

<script>
/* ============ 工具 ============ */
function f1(x){return (Math.round(x*10)/10).toFixed(1)}
function f0(x){return Math.round(x).toString()}

/* ============ 骰子解析 ============ */
function parseDice(expr){
  if(!expr) return null;
  expr = expr.trim().toUpperCase().replace(/\s+/g,'');
  if(!expr || !/^[0-9D+\-]+$/.test(expr)) return null;
  let avg=0,min=0,max=0;
  const s = (expr[0]==='+'||expr[0]==='-')?expr:'+'+expr;
  const tokens = s.match(/[+-][^+-]+/g);
  if(!tokens) return null;
  for(const t of tokens){
    const sign = t[0]==='-'?-1:1;
    const body = t.slice(1);
    if(/^\d+$/.test(body)){
      const n=parseInt(body);
      avg+=sign*n; min+=sign*n; max+=sign*n;
    } else {
      const m = body.match(/^(\d*)D(\d+)$/);
      if(!m) return null;
      const count = m[1]?parseInt(m[1]):1;
      const faces = parseInt(m[2]);
      if(count<=0||faces<=0) return null;
      avg += sign*count*(faces+1)/2;
      min += sign*count;
      max += sign*count*faces;
    }
  }
  if(min<0) return null;
  return {avg,min,max,expr};
}

/* ============ COC 7版 概率计算 ============ */
function getEffectiveHitRate(basePct, netDice) {
  if (basePct <= 0) return 0;
  if (basePct >= 100) return 1;
  
  // 限制骰子数量防止Math.pow溢出导致浏览器卡死
  if (netDice > 5) netDice = 5;
  if (netDice < -5) netDice = -5;

  const t = Math.floor(basePct / 10);
  const u = basePct % 10;
  if (netDice === 0) return basePct / 100;
  
  const numDice = Math.abs(netDice) + 1;
  let prob = 0;
  if (netDice > 0) {
    for (let k = 0; k <= t; k++) {
      const ways = Math.pow(k + 1, numDice) - Math.pow(k, numDice);
      if (k === t) prob += (ways / Math.pow(10, numDice)) * ((u + 1) / 10);
      else prob += (ways / Math.pow(10, numDice));
    }
  } else {
    for (let k = 0; k <= t; k++) {
      const ways = Math.pow(10 - k, numDice) - Math.pow(9 - k, numDice);
      if (k === t) prob += (ways / Math.pow(10, numDice)) * ((u + 1) / 10);
      else prob += (ways / Math.pow(10, numDice));
    }
  }
  return prob;
}

/* ============ 候选伤害池 ============ */
const DICE_POOL = [
  {expr:'1',avg:1,min:1,max:1}, {expr:'2',avg:2,min:2,max:2}, {expr:'1D3',avg:2,min:1,max:3},
  {expr:'1D4',avg:2.5,min:1,max:4}, {expr:'1D4+1',avg:3.5,min:2,max:5}, {expr:'1D6',avg:3.5,min:1,max:6},
  {expr:'1D6+1',avg:4.5,min:2,max:7}, {expr:'1D8',avg:4.5,min:1,max:8}, {expr:'1D10',avg:5.5,min:1,max:10},
  {expr:'2D4+1',avg:6,min:3,max:9}, {expr:'2D6',avg:7,min:2,max:12}, {expr:'1D10+2',avg:7.5,min:3,max:12},
  {expr:'3D4',avg:7.5,min:3,max:12}, {expr:'2D6+1',avg:8,min:3,max:13}, {expr:'1D8+1D6',avg:8,min:2,max:14},
  {expr:'2D6+2',avg:9,min:4,max:14}, {expr:'2D8',avg:9,min:2,max:16}, {expr:'2D6+3',avg:10,min:5,max:15},
  {expr:'3D6',avg:10.5,min:3,max:18}, {expr:'2D8+1',avg:10,min:3,max:17}, {expr:'3D6+2',avg:12.5,min:5,max:20},
  {expr:'4D6',avg:14,min:4,max:24}, {expr:'3D8',avg:13.5,min:3,max:24}, {expr:'2D10+1D6',avg:14.5,min:3,max:26},
  {expr:'5D6',avg:17.5,min:5,max:30}, {expr:'4D8',avg:18,min:4,max:32}, {expr:'3D10+2D6',avg:23.5,min:5,max:42},
  {expr:'6D6',avg:21,min:6,max:36}, {expr:'5D8',avg:22.5,min:5,max:40}, {expr:'4D10',avg:22,min:4,max:40},
  {expr:'8D6',avg:28,min:8,max:48}, {expr:'6D10',avg:33,min:6,max:60}, {expr:'8D8',avg:36,min:8,max:64},
  {expr:'10D6',avg:35,min:10,max:60}, {expr:'8D10',avg:44,min:8,max:80}, {expr:'12D6',avg:42,min:12,max:72},
  {expr:'10D10',avg:55,min:10,max:100}, {expr:'12D10',avg:66,min:12,max:120}, {expr:'15D10',avg:82.5,min:15,max:150}
];

/* ============ 界面逻辑 ============ */
let playerIdCounter = 0;

function addPlayerBtn(e) {
  if (e) e.preventDefault();
  const rows = document.querySelectorAll('.player-row');
  if (rows.length >= 10) {
    alert('为了性能考虑，最多只能添加 10 名玩家哦！');
    return;
  }
  addPlayer();
}

function addPlayer(dmg='1D6', hit=60, hp=12, att=1, dex=50, ready=false){
  const id = ++playerIdCounter;
  const row = document.createElement('div');
  row.className = 'player-row';
  row.dataset.id = id;
  row.innerHTML = `
    <input class="p-dmg" type="text" value="${dmg}" placeholder="伤害">
    <input class="p-hit" type="number" value="${hit}" min="0" max="100" placeholder="命中%">
    <input class="p-hp" type="number" value="${hp}" min="1" placeholder="HP">
    <input class="p-att" type="number" value="${att}" min="1" max="3" placeholder="动数">
    
    <div class="dex-group">
      <input class="p-dex" type="number" value="${dex}" min="1" max="99" placeholder="DEX">
      <label><input class="p-ready" type="checkbox" ${ready?'checked':''}>准备</label>
    </div>
    
    <button class="del" onclick="removePlayer(${id})">✕</button>
  `;
  document.getElementById('playerList').appendChild(row);
}

function removePlayer(id){
  const row = document.querySelector(`.player-row[data-id="${id}"]`);
  if(row) row.remove();
}

function toggleSkill2(){
  const cnt = parseInt(document.querySelector('input[name="skillCount"]:checked').value);
  document.getElementById('skill2Field').style.display = cnt === 2 ? 'flex' : 'none';
}

function toggleOutnumbered(){
  const isChecked = document.getElementById('outnumberedCheck').checked;
  document.getElementById('outnumberedFields').style.display = isChecked ? 'grid' : 'none';
}

/* ============ 生成方案 ============ */
function generateSkillPatterns(targetDPR, skillCount, effHit1, effHit2, maxActions, armor){
  const results = [];
  const combos = [];
  for(let n1=0; n1<=maxActions; n1++){
    for(let n2=0; n2<=maxActions - n1; n2++){
      if(n1 + n2 === 0) continue;
      if(skillCount === 1 && n2 > 0) continue;
      combos.push({n1, n2});
    }
  }

  for(const combo of combos){
    let best = null;
    if(skillCount === 1){
      for(const e of DICE_POOL){
        const total = combo.n1 * effHit1 * Math.max(0, e.avg - armor);
        const err = Math.abs(total - targetDPR);
        if(!best || err < best.err) best = {e1:e, e2:null, total, err, penalty:0};
      }
    } else {
      for(const e1 of DICE_POOL){
        if(combo.n2 === 0){
          const total = combo.n1 * effHit1 * Math.max(0, e1.avg - armor);
          const err = Math.abs(total - targetDPR);
          if(!best || err < best.err) best = {e1, e2:null, total, err, penalty:0};
        } else {
          for(const e2 of DICE_POOL){
            const total = combo.n1 * effHit1 * Math.max(0, e1.avg - armor) + combo.n2 * effHit2 * Math.max(0, e2.avg - armor);
            const err = Math.abs(total - targetDPR);
            const boring = e1.expr === e2.expr && combo.n1 > 0 && combo.n2 > 0;
            const penalty = boring ? 1000 : 0;
            if(!best || (err+penalty) < (best.err+best.penalty)){
              best = {e1, e2, total, err, penalty};
            }
          }
        }
      }
    }
    if(best) results.push({...combo,...best});
  }

  const seen = new Set();
  const deduped = [];
  for(const r of results.sort((a,b)=>a.err-b.err)){
    const key = `${r.n1}-${r.n2}-${r.e1.expr}-${r.e2?r.e2.expr:''}`;
    if(!seen.has(key)){ seen.add(key); deduped.push(r); }
  }
  return deduped.slice(0,6);
}

function describeCombo(n1, n2){
  if(n2 === 0) return `技能1 攻击 ${n1} 次`;
  if(n1 === 0) return `技能2 攻击 ${n2} 次`;
  return `技能1 攻 ${n1} 次 + 技能2 攻 ${n2} 次`;
}

/* ============ 主计算 ============ */
function calc(){
  // 1. 玩家数据
  const rows = document.querySelectorAll('.player-row');
  const players = [];
  const P = rows.length;
  
  for(const row of rows){
    const dmgExpr = row.querySelector('.p-dmg').value.trim();
    if(!dmgExpr) continue;
    const dice = parseDice(dmgExpr);
    if(!dice){ alert(`无法解析伤害表达式: ${dmgExpr}`); return; }
    
    const hitPct = parseFloat(row.querySelector('.p-hit').value);
    const hp = parseFloat(row.querySelector('.p-hp').value);
    const att = parseInt(row.querySelector('.p-att').value) || 1;
    const dex = parseInt(row.querySelector('.p-dex').value) || 50;
    const isReady = row.querySelector('.p-ready').checked;
    
    if(isNaN(hitPct) || hitPct < 0 || hitPct > 100){ alert('命中率需在 0~100 之间'); return; }
    if(isNaN(hp) || hp <= 0){ alert('HP 必须大于 0'); return; }

    players.push({ expr: dice.expr, dmgAvg: dice.avg, baseHitPct: hitPct, hp, att, dex, isReady });
  }
  if(players.length === 0){ alert('请至少添加一个玩家'); return; }

  // 2. 怪物配置 (限制上限防止卡死)
  const M = Math.min(20, Math.max(1, parseInt(document.getElementById('monsterCount').value) || 1));
  const maxActions = Math.min(10, Math.max(1, parseInt(document.getElementById('monsterActions').value) || 1));
  const monsterDex = parseInt(document.getElementById('monsterDex').value) || 50;
  const monsterArmor = Math.max(0, parseInt(document.getElementById('monsterArmor').value) || 0);
  
  const skillCount = parseInt(document.querySelector('input[name="skillCount"]:checked').value);
  const baseHit1 = Math.max(0, Math.min(1, parseFloat(document.getElementById('skillHit1').value)/100));
  const baseHit2 = skillCount === 2 ? Math.max(0, Math.min(1, parseFloat(document.getElementById('skillHit2').value)/100)) : 0;
  
  const isOutnumbered = document.getElementById('outnumberedCheck').checked;
  const playerBonus = (isOutnumbered && M > 1) ? Math.min(2, Math.max(0, parseInt(document.getElementById('playerBonusDice').value) || 0)) : 0;
  const monsterBonus = (isOutnumbered && P > 1) ? Math.min(2, Math.max(0, parseInt(document.getElementById('monsterBonusDice').value) || 0)) : 0;

  const effHit1 = getEffectiveHitRate(baseHit1 * 100, -monsterBonus);
  const effHit2 = getEffectiveHitRate(baseHit2 * 100, -monsterBonus);

  // 3. KP 期望
  const D = parseFloat(document.getElementById('totalDamage').value);
  const T = Math.max(1, parseFloat(document.getElementById('rounds').value));
  const diff = Math.max(0.1, parseFloat(document.getElementById('difficulty').value) || 1);
  if(isNaN(D) || D <= 0){ alert('总伤害需大于 0'); return; }

  // 4. 玩家输出计算 & 先攻数据准备
  let playerDPS = 0;
  const initiativeList = [];

  const playerRowsHTML = players.map((p,i) => {
    let totalHitPct = 0;
    const hitDetails = [];
    for(let j=0; j<p.att; j++) {
      const netDice = j - playerBonus; 
      const rate = getEffectiveHitRate(p.baseHitPct, netDice) * 100;
      totalHitPct += rate;
      hitDetails.push(f1(rate) + '%');
    }
    
    const dps = p.dmgAvg * (totalHitPct / 100);
    playerDPS += dps;

    // 先攻计算：DEX + 准备(50)
    const ini = p.dex + (p.isReady ? 50 : 0);
    initiativeList.push({ name: `玩家 ${i+1}`, type: 'player', ini: ini, dex: p.dex, isReady: p.isReady });

    const surviveRounds = p.hp / (D / T / P);
    const willDie = surviveRounds < T - 0.01;
    const death = willDie
      ? `<span class="death-tag">💀 约 ${f1(surviveRounds)} 轮后倒下</span>`
      : `<span style="color:var(--success-text);font-size:12px;margin-left:8px;font-weight:600">✓ 可存活</span>`;
      
    const attText = p.att > 1 ? `[${p.att}动]` : '';
    const bonusText = playerBonus > 0 ? ` + ${playerBonus}奖` : '';
    
    return `<div class="row">
      <span class="lbl">玩家${i+1} · ${p.expr} @${p.baseHitPct}% ${attText}${bonusText}</span>
      <span class="val">
        DPS: ${f1(dps)} · HP ${p.hp} ${death}
        ${p.att > 1 || playerBonus > 0 ? `<span class="penalty-text">各动实际命中: ${hitDetails.join(' + ')}</span>` : ''}
      </span>
    </div>`;
  }).join('');

  // 怪物先攻
  for(let i=0; i<M; i++){
    initiativeList.push({ name: `怪物 ${i+1}`, type: 'monster', ini: monsterDex, dex: monsterDex, isReady: false });
  }

  // 先攻排序
  initiativeList.sort((a, b) => {
    if (b.ini !== a.ini) return b.ini - a.ini;
    return a.type === 'player' ? -1 : 1;
  });

  const initHTML = initiativeList.map(item => `
    <div class="init-item ${item.type}">
      <span class="init-icon">${item.type === 'player' ? (item.isReady ? '🔫' : '🏃') : '👾'}</span>
      <span>${item.name}</span>
      <span class="dex">(先攻 ${item.ini})</span>
    </div>
  `).join('');
  document.getElementById('initiativeList').innerHTML = initHTML;

  // 5. 怪物数值计算
  const monsterHP_Total = playerDPS * T * diff;
  const monsterHP_Each = monsterHP_Total / M;
  
  const targetActualDPR_Total = D / T;
  const targetActualDPR_Each = targetActualDPR_Total / M;
  const damagePerPlayer = D / P;

  const totalPlayerHP = players.reduce((s,p)=>s+p.hp,0);
  const isTeamWipe = D >= totalPlayerHP;

  // 6. 方案生成（针对单只怪物）
  const patterns = generateSkillPatterns(targetActualDPR_Each, skillCount, effHit1, effHit2, maxActions, monsterArmor);

  // ===== 渲染 =====
  const summaryHTML = `
    <div class="card wide">
      <div class="k">调查员每轮总 DPS（已计入多动与围攻）</div>
      <div class="v">${f1(playerDPS)}</div>
      <div class="sub" style="margin-top:12px">${playerRowsHTML}</div>
    </div>
    <div class="card">
      <div class="k">怪物 HP 期望 (每只)</div>
      <div class="v">${f0(monsterHP_Each)}</div>
      <div class="sub">总计 ${f0(monsterHP_Total)}</div>
    </div>
    <div class="card">
      <div class="k">怪物每轮目标总伤害</div>
      <div class="v">${f1(targetActualDPR_Total)}</div>
      <div class="sub">总计 ${f0(D)} 伤害 / ${T} 轮</div>
    </div>
    <div class="card">
      <div class="k">单只怪物每轮需造成</div>
      <div class="v">${f1(targetActualDPR_Each)}</div>
      <div class="sub">共 ${M} 只怪物</div>
    </div>
    <div class="card">
      <div class="k">每个玩家预期承受</div>
      <div class="v">${f1(damagePerPlayer)}</div>
      <div class="sub">总 HP ${f0(totalPlayerHP)}</div>
      <div class="sub">${isTeamWipe ? '<span class="warn">⚠ 致死量</span>' : `<span class="ok">✓ 预计存活</span>`}</div>
    </div>
  `;
  document.getElementById('summaryCards').innerHTML = summaryHTML;

  const patternsHTML = patterns.map((p, idx) => {
    const isBest = idx === 0;
    const errClass = p.err < 0.3 ? 'good' : p.err < 1.5 ? 'ok' : 'bad';
    const errText = p.err < 0.05 ? '完美匹配' : `偏差 ${p.err > 0 ? '+' : ''}${f1(p.err)}`;
    const style = describeCombo(p.n1, p.n2);

    let skillBlocks = '';
    if(p.n1 > 0) {
      const finalDmg1 = Math.max(0, p.e1.avg - monsterArmor);
      skillBlocks += `
        <div class="skill-block">
          <div class="skill-title"><span>技能 1</span><span>修正命中 ${f1(effHit1*100)}%</span></div>
          <div class="skill-line"><span class="lbl">伤害骰</span><span class="val">${p.e1.expr} (均${f1(p.e1.avg)})</span></div>
          ${monsterArmor > 0 ? `<div class="skill-line"><span class="lbl">穿甲后</span><span class="val">${f1(finalDmg1)}</span></div>` : ''}
          <div class="skill-line"><span class="lbl">分配动数</span><span class="val">${p.n1} 动</span></div>
          <div class="skill-line"><span class="lbl">实际贡献</span><span class="val">${f1(p.n1*effHit1*finalDmg1)}</span></div>
        </div>`;
    }
    if(p.n2 > 0) {
      const finalDmg2 = Math.max(0, p.e2.avg - monsterArmor);
      skillBlocks += `
        <div class="skill-block">
          <div class="skill-title"><span>技能 2</span><span>修正命中 ${f1(effHit2*100)}%</span></div>
          <div class="skill-line"><span class="lbl">伤害骰</span><span class="val">${p.e2.expr} (均${f1(p.e2.avg)})</span></div>
          ${monsterArmor > 0 ? `<div class="skill-line"><span class="lbl">穿甲后</span><span class="val">${f1(finalDmg2)}</span></div>` : ''}
          <div class="skill-line"><span class="lbl">分配动数</span><span class="val">${p.n2} 动</span></div>
          <div class="skill-line"><span class="lbl">实际贡献</span><span class="val">${f1(p.n2*effHit2*finalDmg2)}</span></div>
        </div>`;
    }

    return `
      <div class="pattern ${isBest?'best':''}">
        <span class="tag">${isBest?'★ 最佳匹配 (单只)':'备选方案 '+String.fromCharCode(65+idx)}</span>
        <div class="style">${style}</div>
        ${skillBlocks}
        <div class="total">
          <span class="lbl">单只实际每轮伤害</span>
          <span class="val">${f1(p.total)}</span>
        </div>
        <div class="err ${errClass}">${errText}（目标单只 ${f1(targetActualDPR_Each)}）</div>
      </div>`;
  }).join('');
  document.getElementById('patterns').innerHTML = patternsHTML;

  document.getElementById('output').style.display = 'block';
}

  document.getElementById('playerList').innerHTML = '';
  playerIdCounter = 0;
  addPlayer('1D6', 60, 12, 1, 50, false);
  addPlayer('1D8', 50, 11, 2, 60, true);

  document.getElementById('monsterCount').value = 2;
  document.getElementById('monsterActions').value = 2;
  document.getElementById('monsterDex').value = 50;
  document.getElementById('monsterArmor').value = 2;
  
  document.getElementById('skillHit1').value = 60;
  document.getElementById('skillHit2').value = 40;
  
  document.getElementById('totalDamage').value = 60;
  document.getElementById('rounds').value = 4;
  document.getElementById('difficulty').value = 1;
  
  document.getElementById('outnumberedCheck').checked = true;
  document.getElementById('playerBonusDice').value = 1;
  document.getElementById('monsterBonusDice').value = 1;
  toggleOutnumbered();
  toggleSkill2();
  calc();
}

  addPlayer('1D8', 50, 11, 2, 60, true);
  addPlayer('2D6', 55, 13, 3, 40, false);
  toggleSkill2();
  toggleOutnumbered();
  calc();
};
