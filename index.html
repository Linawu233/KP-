<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COC 怪物期望计算器 v4</title>
<style>
  :root {
    /* 低饱和度白蓝粉配色 */
    --bg: #f7f9fc;
    --panel: #ffffff;
    --panel-inner: #f1f5f9;
    --text-main: #475569;
    --text-muted: #94a3b8;
    --accent-blue: #93c5fd;
    --accent-pink: #fbcfe8;
    --accent-pink-dark: #f472b6;
    --accent-blue-dark: #60a5fa;
    --border: #e2e8f0;
    --danger: #fca5a5;
    --danger-text: #b91c1c;
    --success: #86efac;
    --success-text: #15803d;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 30px 16px 60px;
    background-color: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  
  h1 {
    font-size: 24px; color: var(--accent-blue-dark);
    text-align: center; margin-bottom: 4px;
    font-weight: 600;
  }
  .subtitle {
    color: var(--text-muted); font-size: 13px;
    text-align: center; margin-bottom: 30px;
  }
  h2 {
    font-size: 16px; color: var(--text-main);
    margin: 28px 0 12px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  h2::before {
    content: ''; display: inline-block;
    width: 4px; height: 16px; border-radius: 2px;
    background: linear-gradient(to bottom, var(--accent-blue), var(--accent-pink));
  }

  /* 布局 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .field { display: flex; flex-direction: column; }
  label { font-size: 13px; color: var(--text-main); margin-bottom: 6px; font-weight: 500; }
  input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
  }
  input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.3); }
  .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* 按钮 */
  button {
    margin-top: 20px; padding: 12px 24px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-pink));
    color: #fff; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.3s;
    box-shadow: var(--shadow);
  }
  button:hover { opacity: 0.9; transform: translateY(-1px); }
  button.ghost {
    background: var(--panel); color: var(--text-main);
    border: 1px solid var(--border); box-shadow: none;
  }
  button.ghost:hover { background: var(--panel-inner); }
  button.small { padding: 6px 12px; font-size: 13px; margin-top: 0; }

  /* 玩家列表 */
  .player-header {
    display: grid; grid-template-columns: 2fr 1fr 1fr 40px;
    gap: 12px; font-size: 12px; color: var(--text-muted);
    margin-bottom: 8px; padding: 0 4px; font-weight: 500;
  }
  .player-row {
    display: grid; grid-template-columns: 2fr 1fr 1fr 40px;
    gap: 12px; margin-bottom: 10px; align-items: center;
  }
  .player-row button.del {
    padding: 0; height: 38px; font-size: 14px;
    background: var(--panel); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; margin-top: 0; transition: all 0.2s;
  }
  .player-row button.del:hover { background: var(--danger); color: white; border-color: transparent; }

  /* 单选框 */
  .radio-group { display: flex; gap: 20px; margin-top: 8px; }
  .radio-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: normal; }
  .radio-group input[type="radio"] { width: 16px; height: 16px; accent-color: var(--accent-pink-dark); }

  /* 结果面板 */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; box-shadow: var(--shadow);
  }
  .card .k { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .card .v { font-size: 24px; font-weight: 700; color: var(--accent-blue-dark); margin: 4px 0; }
  .card .v.danger { color: var(--danger-text); }
  .card .sub { font-size: 12px; color: var(--text-muted); }
  .card.wide { grid-column: 1 / -1; }
  .card.wide .v { font-size: 18px; color: var(--text-main); }
  .card .row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .card .row:last-child { border-bottom: none; }
  .card .row .lbl { color: var(--text-muted); font-family: Consolas, monospace; }
  .card .row .val { color: var(--text-main); font-weight: 500; }

  /* 方案列表 */
  .patterns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
  .pattern {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; position: relative;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .pattern::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 4px; height: 100%; background: var(--accent-blue);
  }
  .pattern.best::before { background: var(--accent-pink-dark); }
  
  .pattern .tag {
    display: inline-block; font-size: 11px; padding: 3px 10px;
    border-radius: 12px; background: var(--panel-inner);
    color: var(--text-muted); margin-bottom: 12px; font-weight: 600;
  }
  .pattern.best .tag { background: #fdf2f8; color: var(--accent-pink-dark); }
  
  .pattern .style { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
  
  .skill-block {
    background: var(--panel-inner); border-radius: 8px;
    padding: 12px; margin-bottom: 10px;
  }
  .skill-title { font-size: 13px; font-weight: 600; color: var(--accent-blue-dark); margin-bottom: 8px; display: flex; justify-content: space-between;}
  .skill-line { font-size: 13px; display: flex; justify-content: space-between; padding: 3px 0; }
  .skill-line .lbl { color: var(--text-muted); }
  .skill-line .val { color: var(--text-main); font-family: Consolas, monospace; font-weight: 600;}
  
  .pattern .total {
    font-size: 14px; display: flex; justify-content: space-between;
    padding-top: 12px; border-top: 1px solid var(--border); margin-top: 8px;
  }
  .pattern .total .lbl { color: var(--text-main); font-weight: 600;}
  .pattern .total .val { color: var(--accent-pink-dark); font-weight: 700; font-size: 16px;}
  
  .pattern .err { font-size: 12px; margin-top: 10px; text-align: right; font-weight: 500;}
  .err.good { color: var(--success-text); }
  .err.ok { color: #d97706; }
  .err.bad { color: var(--danger-text); }
  
  .warn { color: var(--danger-text); font-size: 13px; font-weight: 600;}
  .ok { color: var(--success-text); font-size: 13px; font-weight: 600;}
  .death-tag { color: var(--danger-text); font-size: 12px; margin-left: 8px; font-weight: 600; background: #fef2f2; padding: 2px 6px; border-radius: 4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 COC 怪物期望计算器</h1>
  <p class="subtitle">低饱和白蓝粉 · 支持不可名状级别怪物伤害匹配</p>

  <!-- 玩家列表 -->
  <h2>① 调查员列表</h2>
  <div class="player-header">
    <div>伤害表达式</div>
    <div>命中率 %</div>
    <div>HP</div>
    <div></div>
  </div>
  <div id="playerList"></div>
  <button class="small ghost" onclick="addPlayer()">+ 添加玩家</button>

  <!-- 怪物配置 -->
  <h2>② 怪物技能配置</h2>
  <div class="grid">
    <div class="field">
      <label>技能数量</label>
      <div class="radio-group">
        <label><input type="radio" name="skillCount" value="1" onchange="toggleSkill2()"> 1 个技能</label>
        <label><input type="radio" name="skillCount" value="2" checked onchange="toggleSkill2()"> 2 个技能</label>
      </div>
    </div>
    <div class="field">
      <label>技能 1 命中率 %</label>
      <input id="skillHit1" type="number" value="60" min="0" max="100">
    </div>
    <div class="field" id="skill2Field">
      <label>技能 2 命中率 %</label>
      <input id="skillHit2" type="number" value="40" min="0" max="100">
    </div>
  </div>

  <!-- KP 目标 -->
  <h2>③ KP 的期望</h2>
  <div class="grid">
    <div class="field">
      <label>希望怪物造成的总伤害</label>
      <input id="totalDamage" type="number" value="40" min="1">
      <div class="hint">整场战斗对玩家队伍的总伤害。填个 150 试试？</div>
    </div>
    <div class="field">
      <label>希望战斗持续轮数 T</label>
      <input id="rounds" type="number" value="4" min="1" step="1">
    </div>
    <div class="field">
      <label>难度系数</label>
      <input id="difficulty" type="number" value="1" min="0.1" step="0.1">
    </div>
  </div>

  <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
    <button onclick="calc()">开始计算</button>
    <button class="ghost" onclick="resetAll()">重置面板</button>
  </div>

  <div id="output" style="display:none; margin-top: 40px;">
    <h2>④ 怪物数值与玩家承受</h2>
    <div class="cards" id="summaryCards"></div>

    <h2>⑤ 可行的技能方案</h2>
    <p class="hint" style="margin-top:-8px; margin-bottom: 16px;">按与目标每轮实际伤害的偏差排序。如果你看到 8D10，说明 KP 想撕卡了。</p>
    <div class="patterns-grid" id="patterns"></div>
  </div>
</div>

<script>
/* ============ 工具 ============ */
function f1(x){return (Math.round(x*10)/10).toFixed(1)}
function f0(x){return Math.round(x).toString()}

/* ============ 骰子解析 ============ */
function parseDice(expr){
  if(!expr) return null;
  expr = expr.trim().toUpperCase().replace(/\s+/g,'');
  if(!expr || !/^[0-9D+\-]+$/.test(expr)) return null;
  let avg=0,min=0,max=0;
  const s = (expr[0]==='+'||expr[0]==='-')?expr:'+'+expr;
  const tokens = s.match(/[+-][^+-]+/g);
  if(!tokens) return null;
  for(const t of tokens){
    const sign = t[0]==='-'?-1:1;
    const body = t.slice(1);
    if(/^\d+$/.test(body)){
      const n=parseInt(body);
      avg+=sign*n; min+=sign*n; max+=sign*n;
    } else {
      const m = body.match(/^(\d*)D(\d+)$/);
      if(!m) return null;
      const count = m[1]?parseInt(m[1]):1;
      const faces = parseInt(m[2]);
      if(count<=0||faces<=0) return null;
      avg += sign*count*(faces+1)/2;
      min += sign*count;
      max += sign*count*faces;
    }
  }
  if(min<0) return null;
  return {avg,min,max,expr};
}

/* ============ 庞大且致命的候选伤害池 ============ */
const DICE_POOL = [
  // 低伤害 (适合杂兵)
  {expr:'1',avg:1,min:1,max:1},
  {expr:'2',avg:2,min:2,max:2},
  {expr:'1D3',avg:2,min:1,max:3},
  {expr:'1D4',avg:2.5,min:1,max:4},
  {expr:'1D4+1',avg:3.5,min:2,max:5},
  {expr:'1D6',avg:3.5,min:1,max:6},
  {expr:'1D6+1',avg:4.5,min:2,max:7},
  {expr:'1D8',avg:4.5,min:1,max:8},
  {expr:'1D10',avg:5.5,min:1,max:10},
  {expr:'2D4+1',avg:6,min:3,max:9},
  // 中伤害 (标准怪物)
  {expr:'2D6',avg:7,min:2,max:12},
  {expr:'1D10+2',avg:7.5,min:3,max:12},
  {expr:'3D4',avg:7.5,min:3,max:12},
  {expr:'2D6+1',avg:8,min:3,max:13},
  {expr:'1D8+1D6',avg:8,min:2,max:14},
  {expr:'2D6+2',avg:9,min:4,max:14},
  {expr:'2D8',avg:9,min:2,max:16},
  {expr:'2D6+3',avg:10,min:5,max:15},
  {expr:'3D6',avg:10.5,min:3,max:18},
  {expr:'2D8+1',avg:10,min:3,max:17},
  // 高伤害 (精英怪/食尸鬼)
  {expr:'3D6+2',avg:12.5,min:5,max:20},
  {expr:'4D6',avg:14,min:4,max:24},
  {expr:'3D8',avg:13.5,min:3,max:24},
  {expr:'2D10+1D6',avg:14.5,min:3,max:26},
  {expr:'5D6',avg:17.5,min:5,max:30},
  {expr:'4D8',avg:18,min:4,max:32},
  {expr:'3D10+2D6',avg:23.5,min:5,max:42},
  {expr:'6D6',avg:21,min:6,max:36},
  {expr:'5D8',avg:22.5,min:5,max:40},
  {expr:'4D10',avg:22,min:4,max:40},
  // 极高伤害 (神话生物/完全不可能战胜)
  {expr:'8D6',avg:28,min:8,max:48},
  {expr:'6D10',avg:33,min:6,max:60},
  {expr:'8D8',avg:36,min:8,max:64},
  {expr:'10D6',avg:35,min:10,max:60},
  {expr:'8D10',avg:44,min:8,max:80},
  {expr:'12D6',avg:42,min:12,max:72},
  {expr:'10D10',avg:55,min:10,max:100},
  {expr:'12D10',avg:66,min:12,max:120},
  {expr:'15D10',avg:82.5,min:15,max:150},
  {expr:'20D10',avg:110,min:20,max:200}
];

/* ============ 玩家列表 ============ */
let playerIdCounter = 0;

function addPlayer(dmg='1D6', hit=60, hp=12){
  const id = ++playerIdCounter;
  const row = document.createElement('div');
  row.className = 'player-row';
  row.dataset.id = id;
  row.innerHTML = `
    <input class="p-dmg" type="text" value="${dmg}" placeholder="例如 1D6+1D4">
    <input class="p-hit" type="number" value="${hit}" min="0" max="100" placeholder="60">
    <input class="p-hp" type="number" value="${hp}" min="1" placeholder="12">
    <button class="del" onclick="removePlayer(${id})">✕</button>
  `;
  document.getElementById('playerList').appendChild(row);
}

function removePlayer(id){
  const row = document.querySelector(`.player-row[data-id="${id}"]`);
  if(row) row.remove();
}

function toggleSkill2(){
  const cnt = parseInt(document.querySelector('input[name="skillCount"]:checked').value);
  document.getElementById('skill2Field').style.display = cnt === 2 ? 'flex' : 'none';
}

/* ============ 生成技能方案 ============ */
function generateSkillPatterns(targetActualDPR, playerCount, skillCount, hit1, hit2){
  const combos = [];
  if(skillCount === 1){
    for(let n=1;n<=3;n++) combos.push({n1:n,n2:0});
  } else {
    const cands = [[1,1],[1,2],[2,1],[2,2],[1,3],[3,1]];
    for(const [n1,n2] of cands) combos.push({n1,n2});
  }

  const results = [];
  for(const combo of combos){
    let best = null;
    if(skillCount === 1){
      for(const e of DICE_POOL){
        const total = combo.n1 * hit1 * e.avg;
        const err = Math.abs(total - targetActualDPR);
        if(!best || err < best.err) best = {e1:e,e2:null,total,err,penalty:0};
      }
    } else {
      for(const e1 of DICE_POOL){
        for(const e2 of DICE_POOL){
          const total = combo.n1*hit1*e1.avg + combo.n2*hit2*e2.avg;
          const err = Math.abs(total - targetActualDPR);
          const boring = e1.expr === e2.expr;
          const penalty = boring ? 1000 : 0;
          if(!best || (err+penalty) < (best.err+best.penalty)){
            best = {e1,e2,total,err,penalty};
          }
        }
      }
    }
    if(best) results.push({...combo,...best});
  }

  const seen = new Set();
  const deduped = [];
  for(const r of results.sort((a,b)=>a.err-b.err)){
    const key = `${r.n1}-${r.n2}`;
    if(!seen.has(key)){ seen.add(key); deduped.push(r); }
  }
  return deduped.slice(0,6);
}

function describeCombo(n1, n2){
  if(n2 === 0) return `单技能 · 每轮 ${n1} 次攻击`;
  if(n1 === n2) return `双技能均衡 · 各 ${n1} 次攻击`;
  if(n1 > n2) return `技能1 主攻（${n1}次） / 技能2 辅助（${n2}次）`;
  return `技能2 主攻（${n2}次） / 技能1 辅助（${n1}次）`;
}

/* ============ 主计算 ============ */
function calc(){
  const rows = document.querySelectorAll('.player-row');
  const players = [];
  for(const row of rows){
    const dmgExpr = row.querySelector('.p-dmg').value.trim();
    if(!dmgExpr) continue;
    const dice = parseDice(dmgExpr);
    if(!dice){ alert(`无法解析伤害表达式: ${dmgExpr}`); return; }
    const hitPct = parseFloat(row.querySelector('.p-hit').value);
    const hp = parseFloat(row.querySelector('.p-hp').value);
    if(isNaN(hitPct) || hitPct < 0 || hitPct > 100){ alert('命中率需在 0~100 之间'); return; }
    if(isNaN(hp) || hp <= 0){ alert('HP 必须大于 0'); return; }
    players.push({
      expr: dice.expr, dmgAvg: dice.avg, dmgMin: dice.min, dmgMax: dice.max,
      hitRate: hitPct/100, hp
    });
  }
  if(players.length === 0){ alert('请至少添加一个玩家'); return; }

  const skillCount = parseInt(document.querySelector('input[name="skillCount"]:checked').value);
  const hit1 = Math.max(0, Math.min(1, parseFloat(document.getElementById('skillHit1').value)/100));
  const hit2 = skillCount === 2
    ? Math.max(0, Math.min(1, parseFloat(document.getElementById('skillHit2').value)/100))
    : 0;

  const D = parseFloat(document.getElementById('totalDamage').value);
  const T = Math.max(1, parseFloat(document.getElementById('rounds').value));
  const diff = Math.max(0.1, parseFloat(document.getElementById('difficulty').value) || 1);
  if(isNaN(D) || D <= 0){ alert('总伤害需大于 0'); return; }

  // 玩家总输出
  const playerDPS = players.reduce((s,p) => s + p.dmgAvg * p.hitRate, 0);
  const playerDPSMin = players.reduce((s,p) => s + p.dmgMin * p.hitRate, 0);
  const playerDPSMax = players.reduce((s,p) => s + p.dmgMax * p.hitRate, 0);
  
  // 怪物 HP 期望
  const monsterHP = playerDPS * T * diff;
  const hpLow = monsterHP * 0.8, hpHigh = monsterHP * 1.2;
  
  // 怪物伤害
  const targetActualDPR = D / T;
  const damagePerPlayer = D / players.length;
  const P = players.length;

  // 生存检查
  const deathRisks = players.map((p, i) => {
    const surviveRounds = p.hp / (targetActualDPR / P);
    return { index: i, hp: p.hp, surviveRounds, willDie: surviveRounds < T - 0.01 };
  });
  const totalPlayerHP = players.reduce((s,p)=>s+p.hp,0);
  const isTeamWipe = D >= totalPlayerHP;

  // 生成技能方案
  const patterns = generateSkillPatterns(targetActualDPR, P, skillCount, hit1, hit2);

  // ===== 渲染 =====
  const playerRowsHTML = players.map((p,i) => {
    const dr = deathRisks[i];
    const death = dr.willDie
      ? `<span class="death-tag">💀 约 ${f1(dr.surviveRounds)} 轮后倒下</span>`
      : `<span style="color:var(--success-text);font-size:12px;margin-left:8px;font-weight:600">✓ 可存活</span>`;
    return `<div class="row">
      <span class="lbl">玩家${i+1} · ${p.expr} @${(p.hitRate*100).toFixed(0)}%</span>
      <span class="val">${f1(p.dmgAvg*p.hitRate)} DPS · HP ${p.hp} ${death}</span>
    </div>`;
  }).join('');

  const summaryHTML = `
    <div class="card wide">
      <div class="k">调查员每轮总 DPS（已含命中率）</div>
      <div class="v">${f1(playerDPS)} <span style="font-size:14px;color:var(--text-muted)">（浮动范围 ${f1(playerDPSMin)} ~ ${f1(playerDPSMax)}）</span></div>
      <div class="sub" style="margin-top:12px">${playerRowsHTML}</div>
    </div>
    <div class="card">
      <div class="k">怪物 HP 期望</div>
      <div class="v">${f0(monsterHP)}</div>
      <div class="sub">建议浮动区间 ${f0(hpLow)} ~ ${f0(hpHigh)}</div>
    </div>
    <div class="card">
      <div class="k">怪物每轮目标实际伤害</div>
      <div class="v">${f1(targetActualDPR)}</div>
      <div class="sub">总伤害目标 ${f0(D)} / ${T} 轮</div>
    </div>
    <div class="card">
      <div class="k">每个玩家预期承受</div>
      <div class="v">${f1(damagePerPlayer)}</div>
      <div class="sub">共 ${P} 名玩家，概率均等分摊</div>
    </div>
    <div class="card">
      <div class="k">玩家总 HP 承受力</div>
      <div class="v ${isTeamWipe?'danger':''}">${f0(totalPlayerHP)}</div>
      <div class="sub">${isTeamWipe
        ? '<span class="warn">⚠️ 致死量：总伤害 ≥ 总 HP，大概率团灭</span>'
        : `<span class="ok">✓ 预计存活，剩余 ${f0(totalPlayerHP - D)} HP</span>`}</div>
    </div>
  `;
  document.getElementById('summaryCards').innerHTML = summaryHTML;

  const patternsHTML = patterns.map((p, idx) => {
    const isBest = idx === 0;
    const errClass = p.err < 0.3 ? 'good' : p.err < 1.5 ? 'ok' : 'bad';
    const errText = p.err < 0.05 ? '完美匹配' : `偏差 ${p.err > 0 ? '+' : ''}${f1(p.err)}`;
    const style = describeCombo(p.n1, p.n2);

    let skillBlocks = '';
    if(skillCount === 1){
      skillBlocks = `
        <div class="skill-block">
          <div class="skill-title"><span>技能 1</span><span>命中 ${(hit1*100).toFixed(0)}%</span></div>
          <div class="skill-line"><span class="lbl">伤害骰</span><span class="val">${p.e1.expr}（期望 ${f1(p.e1.avg)}）</span></div>
          <div class="skill-line"><span class="lbl">每轮次数</span><span class="val">${p.n1} 次</span></div>
          <div class="skill-line"><span class="lbl">实际每轮贡献</span><span class="val">${f1(p.n1*hit1*p.e1.avg)}</span></div>
        </div>`;
    } else {
      skillBlocks = `
        <div class="skill-block">
          <div class="skill-title"><span>技能 1</span><span>命中 ${(hit1*100).toFixed(0)}%</span></div>
          <div class="skill-line"><span class="lbl">伤害骰</span><span class="val">${p.e1.expr}（期望 ${f1(p.e1.avg)}）</span></div>
          <div class="skill-line"><span class="lbl">每轮次数</span><span class="val">${p.n1} 次</span></div>
          <div class="skill-line"><span class="lbl">实际每轮贡献</span><span class="val">${f1(p.n1*hit1*p.e1.avg)}</span></div>
        </div>
        <div class="skill-block">
          <div class="skill-title"><span>技能 2</span><span>命中 ${(hit2*100).toFixed(0)}%</span></div>
          <div class="skill-line"><span class="lbl">伤害骰</span><span class="val">${p.e2.expr}（期望 ${f1(p.e2.avg)}）</span></div>
          <div class="skill-line"><span class="lbl">每轮次数</span><span class="val">${p.n2} 次</span></div>
          <div class="skill-line"><span class="lbl">实际每轮贡献</span><span class="val">${f1(p.n2*hit2*p.e2.avg)}</span></div>
        </div>`;
    }

    return `
      <div class="pattern ${isBest?'best':''}">
        <span class="tag">${isBest?'★ 最佳匹配':'备选方案 '+String.fromCharCode(65+idx)}</span>
        <div class="style">${style}</div>
        ${skillBlocks}
        <div class="total">
          <span class="lbl">总实际每轮伤害</span>
          <span class="val">${f1(p.total)}</span>
        </div>
        <div class="err ${errClass}">${errText}（目标 ${f1(targetActualDPR)}）</div>
      </div>`;
  }).join('');
  document.getElementById('patterns').innerHTML = patternsHTML;

  document.getElementById('output').style.display = 'block';
}

  document.getElementById('playerList').innerHTML = '';
  addPlayer('1D6', 60, 12);

  addPlayer('2D6', 55, 13);
  document.getElementById('skillHit1').value = 60;
  document.getElementById('skillHit2').value = 40;

}
